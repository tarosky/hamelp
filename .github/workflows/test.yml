name: WordPress Plugin Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    strategy:
      # Without this a single failing combination cancels the others, hiding how
      # widespread a failure actually is.
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]
        wp: [ 'latest', '6.6' ]
    uses: tarosky/workflows/.github/workflows/wp-unit-test.yml@main
    with:
      php_version: ${{ matrix.php }}
      wp_version: ${{ matrix.wp }}
      # Blocks are registered from the gitignored assets/blocks, so without a
      # build no block is registered and anything touching the registry or
      # do_blocks() cannot be tested. Same command bin/build.sh uses at release.
      package: 'package'

  phpcs:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with composer v2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          tools: composer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-progress

      - name: PHP CodeSniffer
        run: composer lint

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          tools: composer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHPStan
        run: composer phpstan

  phplint:
    uses: tarosky/workflows/.github/workflows/phplint.yml@main
    with:
      php_versions: '["7.4", "8.3"]'

  assets:
    name: Test Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: JS Unit Test
        run: npm run test:js

      # bin/build.sh runs the same command at release time, so a build break is
      # caught here in one clear place instead of at deploy.
      - name: Build Assets
        run: npm run package

  status:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [ test, phpcs, phpstan, phplint, assets ]
    if: always()
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
